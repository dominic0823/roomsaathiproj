{% extends "base.html" %}
{% block content %}<section class="container auth-section"><div class="auth-card">
  <h1>Reset your password</h1><p class="muted">Enter your account email and we'll send you a reset link.</p>
  <form method="post">{% csrf_token %}{{ form.email.errors }}<div class="form-group"><label>Email</label>{{ form.email }}</div>
  <button class="btn btn-primary btn-block" type="submit">Send reset link</button></form></div></section>{% endblock %}
